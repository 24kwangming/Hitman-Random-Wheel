<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>随机杀手转盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 80, 80, 0.12), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255, 180, 0, 0.10), transparent 45%),
      #111317;
    color: #eee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  h1 {
    text-align: center; font-size: 24px; letter-spacing: 4px;
    color: #ff4646; text-shadow: 0 0 18px rgba(255,70,70,0.45); margin-bottom: 18px;
  }
  .main-panel {
    display: grid; grid-template-columns: 440px 1fr; gap: 24px;
    max-width: 1200px; margin: 0 auto 24px;
  }
  .wheel-box { position: relative; width: 420px; height: 420px; margin: 0 auto; }
  #mainWheel {
    width: 100%; height: 100%; border-radius: 50%; border: 6px solid #2a2d33;
    box-shadow: 0 0 0 2px #111, 0 0 30px rgba(255,70,70,0.25), inset 0 0 40px rgba(0,0,0,0.6);
    transition: transform 4s cubic-bezier(0.17,0.67,0.24,1); background: #1a1c20;
  }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 28px solid #ff4646; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); z-index: 5;
  }
  .center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 72px; height: 72px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3a3d44, #111);
    border: 4px solid #ff4646; box-shadow: 0 0 18px rgba(255,70,70,0.45); z-index: 4;
  }
  .wheel-controls { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
  button {
    border: none; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700;
    color: #fff; cursor: pointer; letter-spacing: 1px;
    transition: transform 0.1s ease, filter 0.2s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { cursor: not-allowed; filter: grayscale(0.6) brightness(0.7); }
  .btn-spin { background: linear-gradient(180deg,#ff5f5f,#d62424); box-shadow: 0 6px 14px rgba(214,36,36,0.45); }
  .btn-reset { background: linear-gradient(180deg,#4f7cff,#2449d6); box-shadow: 0 6px 14px rgba(36,73,214,0.45); }
  .btn-re { background: linear-gradient(180deg,#3ec560,#1f8a3d); box-shadow: 0 6px 14px rgba(31,138,61,0.35); }
  .btn-extra { background: linear-gradient(180deg,#ffb024,#d67b12); box-shadow: 0 6px 14px rgba(214,123,18,0.45); }
  .result-panel {
    background: linear-gradient(180deg,#1c1f24,#14161a); border: 1px solid #2a2d33;
    border-radius: 16px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .result-panel h2 {
    font-size: 18px; color: #ff4646; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid #2a2d33;
  }
  .result-row {
    display: flex; justify-content: space-between; padding: 10px 4px;
    border-bottom: 1px dashed #2a2d33; font-size: 15px;
  }
  .result-row .label { color: #9aa0a6; }
  .result-row .value { color: #ffdd77; font-weight: 700; }
  .pair-list {
    margin-top: 14px; display: grid; gap: 8px; max-height: 260px;
    overflow-y: auto; padding-right: 4px;
  }
  .pair-item {
    background: #23262c; border-left: 4px solid #ff4646;
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .status-text {
    margin-top: 14px; padding: 10px; background: #23262c;
    border-radius: 8px; font-size: 13px; color: #b8c2cc;
  }
  .slots-panel { max-width: 1200px; margin: 0 auto; }
  .slots-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
  .slot-card {
    background: linear-gradient(180deg,#1c1f24,#14161a); border: 1px solid #2a2d33;
    border-radius: 14px; padding: 18px; box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .slot-card.active { border-color: #ff4646; }
  .slot-card.disabled { opacity: 0.4; }
  .slot-card h3 { font-size: 15px; color: #ff4646; margin-bottom: 10px; letter-spacing: 1px; }
  .slot-result {
    min-height: 44px; background: #0f1114; border: 1px solid #2a2d33;
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
    color: #ffdd77; font-weight: 700; margin-bottom: 8px; word-break: break-all;
  }
  .slot-type { font-size: 12px; color: #9aa0a6; margin-bottom: 10px; min-height: 18px; }
  .extra-card { background: linear-gradient(180deg,#2a1d08,#1a1205); border: 1px solid #d67b12; }
  .extra-card h3 { color: #ffb024; }
  .hidden { display: none !important; }
  @media (max-width: 900px) {
    .main-panel { grid-template-columns: 1fr; }
    .wheel-box { width: 340px; height: 340px; }
    .slots-grid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>

<h1>随机杀手转盘</h1>

<div class="main-panel">
  <div>
    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="mainWheel"></canvas>
      <div class="center"></div>
    </div>
    <div class="wheel-controls">
      <button id="spinMainBtn" class="btn-spin">主抽取</button>
      <button id="resetAllBtn" class="btn-reset">全部重置</button>
    </div>
  </div>

  <div class="result-panel">
    <h2>主流程结果</h2>
    <div class="result-row"><span class="label">地图</span><span class="value" id="mapRes">等待抽取</span></div>
    <div class="result-row"><span class="label">开局</span><span class="value" id="startRes">等待抽取</span></div>
    <div class="result-row"><span class="label">偷运点</span><span class="value" id="stashRes">等待抽取</span></div>
    <div class="result-row"><span class="label">偷运点类型</span><span class="value" id="stashTypeRes">-</span></div>

    <h2 style="margin-top:16px;">目标 & 伪装配对</h2>
    <div class="pair-list" id="pairList">等待抽取</div>
    <div class="status-text" id="flowState">状态：未开始</div>
  </div>
</div>

<div class="slots-panel">
  <div class="slots-grid">
    <div class="slot-card" id="card-stash">
      <h3>偷运栏</h3>
      <div class="slot-result" id="res-stash">未启用</div>
      <div class="slot-type" id="type-stash"></div>
      <button id="btn-re-stash" class="btn-re">重抽偷运栏</button>
    </div>
    <div class="slot-card" id="card-weapon">
      <h3>武器栏</h3>
      <div class="slot-result" id="res-weapon">未启用</div>
      <div class="slot-type" id="type-weapon"></div>
      <button id="btn-re-weapon" class="btn-re">重抽武器栏</button>
    </div>
    <div class="slot-card" id="card-prop1">
      <h3>道具栏1</h3>
      <div class="slot-result" id="res-prop1">未启用</div>
      <div class="slot-type" id="type-prop1"></div>
      <button id="btn-re-prop1" class="btn-re">重抽道具栏1</button>
    </div>
    <div class="slot-card" id="card-prop2">
      <h3>道具栏2</h3>
      <div class="slot-result" id="res-prop2">未启用</div>
      <div class="slot-type" id="type-prop2"></div>
      <button id="btn-re-prop2" class="btn-re">重抽道具栏2</button>
    </div>
  </div>
  <div style="margin-top:16px;">
    <div class="slot-card extra-card hidden" id="card-extra">
      <h3>额外物品栏</h3>
      <div class="slot-result" id="res-extra">未启用</div>
      <div class="slot-type" id="type-extra"></div>
      <button id="btn-re-extra" class="btn-extra">重抽额外栏</button>
    </div>
  </div>
</div>

function getItemType(itemName) {
  if (containerPool.includes(itemName)) return 'container';
  if (largeItemPool.includes(itemName)) return 'large';
  return 'small';
}
function getTypeNameText(type) {
  if (type === 'container') return '【容器】';
  if (type === 'large') return '【大型武器】';
  if (type === 'small') return '【小型道具】';
  return '【未识别】';
}
function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function extractTag(str) { const m = str.match(/（(.+)）/); return m ? m[1] : ''; }

function isBerlinBus(s) { return s === "公交车站（伪装）"; }
function isEkhaz(s) { return s.includes("埃卡扎里塔外部"); }
function isClubEntrance(s) { return s.includes("俱乐部入口"); }
function isSuitStart(s) { return s.includes("（西装）"); }
function isDisguiseStart(s) { return s.includes("（伪装）"); }

function getAvailableDisguises(mapName, startItem) {
  const pool = (mapDisguisePool[mapName] || []).slice();
  return pool.filter(d => {
    if (d.includes("潜入山道限定")) {
      return mapName === "北海道" && startItem && startItem.includes("潜入山道");
    }
    return true;
  });
}

const canvas = document.getElementById('mainWheel');
const ctx = canvas.getContext('2d');
canvas.width = 420; canvas.height = 420;

function drawMainWheel() {
  const seg = mapPool.length;
  const segAng = (Math.PI * 2) / seg;
  ctx.clearRect(0, 0, 420, 420);
  ctx.save(); ctx.translate(210, 210);
  for (let i = 0; i < seg; i++) {
    const s = i * segAng, e = s + segAng;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 190, s, e); ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#2b2d33' : '#1c1e22';
    ctx.fill();
    ctx.strokeStyle = '#ff4646'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.rotate(s + segAng / 2);
    ctx.fillStyle = '#ffdd77';
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(mapPool[i], 160, 5);
    ctx.restore();
  }
  ctx.restore();
}

function updateSlotButtons() {
  const cardStash = document.getElementById('card-stash');
  const cardWeapon = document.getElementById('card-weapon');
  const cardProp1 = document.getElementById('card-prop1');
  const cardProp2 = document.getElementById('card-prop2');
  const cardExtra = document.getElementById('card-extra');
  const btnStash = document.getElementById('btn-re-stash');
  const btnWeapon = document.getElementById('btn-re-weapon');
  const btnProp1 = document.getElementById('btn-re-prop1');
  const btnProp2 = document.getElementById('btn-re-prop2');
  const btnExtra = document.getElementById('btn-re-extra');

  cardStash.classList.add('active');
  btnStash.disabled = !globalMapName;

  if (!globalMapName) {
    cardWeapon.classList.add('disabled');
    cardProp1.classList.add('disabled');
    cardProp2.classList.add('disabled');
    cardExtra.classList.add('hidden');
    btnWeapon.disabled = true; btnProp1.disabled = true;
    btnProp2.disabled = true; btnExtra.disabled = true;
    return;
  }

  const start = globalStartItem;

  if (isBerlinBus(start)) {
    cardWeapon.classList.add('disabled');
    cardProp1.classList.add('disabled');
    cardProp2.classList.add('disabled');
    cardExtra.classList.add('hidden');
    btnWeapon.disabled = true; btnProp1.disabled = true;
    btnProp2.disabled = true; btnExtra.disabled = true;
    document.getElementById('flowState').textContent = '状态：柏林公交车站，偷运栏可用；武器栏、道具栏1、道具栏2禁用。';
    return;
  }

  if (isEkhaz(start)) {
    cardWeapon.classList.add('disabled');
    cardProp2.classList.add('disabled');
    cardExtra.classList.add('hidden');
    btnWeapon.disabled = true; btnProp2.disabled = true; btnExtra.disabled = true;
    cardProp1.classList.remove('disabled');
    btnProp1.disabled = false;
    document.getElementById('flowState').textContent = '状态：埃卡扎里塔外部特例，偷运栏和道具栏1可用；武器栏、道具栏2禁用。';
    return;
  }

  if (isClubEntrance(start)) {
    cardWeapon.classList.add('disabled');
    btnWeapon.disabled = true;
  } else {
    cardWeapon.classList.remove('disabled');
    btnWeapon.disabled = false;
  }

  cardProp1.classList.remove('disabled');
  btnProp1.disabled = false;
  cardProp2.classList.remove('disabled');
  btnProp2.disabled = !resProp1Val;

  if (extraItemVal) {
    cardExtra.classList.remove('hidden');
    btnExtra.disabled = false;
  } else {
    cardExtra.classList.add('hidden');
    btnExtra.disabled = true;
  }

  if (isSuitStart(start)) {
    document.getElementById('flowState').textContent = '状态：西装开局，执行链式道具逻辑；额外栏按条件动态出现。';
  } else {
    document.getElementById('flowState').textContent = '状态：普通伪装开局，道具栏1和道具栏2都从随身道具池抽取。';
  }
}

    const availableDisguises = getAvailableDisguises(mapName, startItem);

    // 先清空所有状态和DOM（包含pairList）
    resetAllState();

    // 再设置全局变量
    globalMapName = mapName;
    globalStartItem = startItem;
    globalStashItem = stashItem;
    globalStashTag = stashTag;

    // 渲染主流程结果
    document.getElementById('mapRes').textContent = mapName;
    document.getElementById('startRes').textContent = startItem;
    document.getElementById('stashRes').textContent = stashItem;
    document.getElementById('stashTypeRes').textContent = stashTag;

    // 渲染目标-伪装配对
    const pairList = document.getElementById('pairList');
    pairList.innerHTML = '';
    if (targets.length === 0) {
      pairList.textContent = '该地图无目标';
    } else {
      targets.forEach(target => {
        const d = availableDisguises.length > 0
          ? availableDisguises[Math.floor(Math.random() * availableDisguises.length)]
          : '（无可用伪装）';
        const div = document.createElement('div');
        div.className = 'pair-item';
        div.textContent = `目标：${target} ｜ 伪装：${d}`;
        pairList.appendChild(div);
      });
    }

    spinning = false;
    document.getElementById('spinMainBtn').disabled = false;
    updateSlotButtons();
  }, 4100);
};

document.getElementById('resetAllBtn').onclick = function () {
  canvas.style.transition = 'none';
  currentAngle = 0;
  canvas.style.transform = 'rotate(0deg)';
  canvas.offsetHeight;
  canvas.style.transition = 'transform 4s cubic-bezier(0.17,0.67,0.24,1)';
  resetAllState();
};

drawMainWheel();
resetAllState();
</script>
